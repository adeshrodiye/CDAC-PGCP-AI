{% extends "base.html" %}
{% block title %}Edit Profile - MyBlog{% endblock %}

{% block content %}
    <div class="form-wrapper">
        <h1 class="page-title">Edit Profile</h1>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="5" placeholder="Tell readers a bit about yourself...">{{ current_user.bio }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
{% endblock %}
