<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% if title %}
        <title>My Book Store - {{title}}</title>
    {% else %}
        <title>My Book Store </title>
    {% endif %}
</head>
<body>
{% extends 'base.html' %}
    {% block body %}
        {% for book in books %}
            <article class="media content-section">
                <div class="media-body">
                    <div class="article-metadata">
                        <a class="mr-2" href="{{url_for('book_details', book_id=book.id)}}">{{ book.title }}</a>
                    </div>
                    <div>
                        <small class="text-muted">By {{ book.author }}</small>
                    </div>
                    <div>
                        <small class="text-muted">{{ book.price }} rs.</small>
                    </div>
                </div>
            </article>
        {% endfor %}
    {% endblock %}
</body>
</html>
